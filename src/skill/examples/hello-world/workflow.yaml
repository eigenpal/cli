name: hello-world
version: 1.0.0
description: Smallest possible workflow — echoes the input back through transform.script.

triggerMethods:
  - type: api

inputs:
  - name: text
    type: string

steps:
  - name: echo
    type: transform.script
    with:
      inputs:
        text: '{{ input.text }}'
      # Return-type annotation (`: { length: number; original: string }`)
      # is mandatory and becomes this step's output schema.
      function: |
        function script(text: string): { length: number; original: string } {
          return { length: text.length, original: text };
        }

output:
  length: '{{ steps.echo.output.length }}'
  original: '{{ steps.echo.output.original }}'

name: __NAME__
version: 1.0.0
description: Classify free-form text into one of a fixed set of labels.

triggerMethods:
  - type: api

inputs:
  - name: text
    type: string
    description: Text to classify

steps:
  - name: classify
    type: ai.extract
    with:
      input: '{{ input.text }}'
      schema:
        type: object
        properties:
          label:
            type: string
            enum: [positive, neutral, negative]
          confidence:
            type: number
            minimum: 0
            maximum: 1
          rationale:
            type: string
        required: [label, confidence]

output:
  label: '{{ steps.classify.output.label }}'
  confidence: '{{ steps.classify.output.confidence }}'
  rationale: '{{ steps.classify.output.rationale | default: null }}'

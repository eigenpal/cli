name: __NAME__
version: 1.0.0
description: Parse a PDF and extract structured fields with an LLM.

triggerMethods:
  - type: api

inputs:
  - name: document
    type: file
    description: PDF or image to extract from

steps:
  - name: parse
    type: ai.parse-v2
    with:
      input: '{{ input.document }}'

  - name: extract
    type: ai.extract
    with:
      input: '{{ steps.parse.output.text }}'
      schema:
        type: object
        properties:
          invoiceNumber: { type: string }
          totalAmount: { type: number }
          vendorName: { type: string }
          dueDate: { type: string, format: date }
        required: [invoiceNumber, totalAmount, vendorName]

output:
  invoiceNumber: '{{ steps.extract.output.extracted.invoiceNumber }}'
  totalAmount: '{{ steps.extract.output.extracted.totalAmount }}'
  vendorName: '{{ steps.extract.output.extracted.vendorName }}'
  dueDate: '{{ steps.extract.output.extracted.dueDate | default: null }}'
